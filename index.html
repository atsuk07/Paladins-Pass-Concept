<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>パラディンズ・パス・コンセプト</title>
    <link rel="icon" href="/favicon.png" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div class="mobile-header">
      <button id="mobile-menu-btn" class="mobile-menu-btn">☰</button>
      <span id="mobile-header-title">Paladins Pass Concept</span>
    </div>
    <div class="app-container">
      <div id="sidebar-wrapper" class="sidebar-wrapper">
        <aside class="sidebar">
          <div class="sidebar-header">
            <h1 id="sidebar-home-link" class="clickable-header">Paladins Pass Concept</h1>
          </div>
          <nav class="sidebar-nav">
            <h2>コンセプト</h2>
            <ul id="concept-list">
              <!-- Concepts dynamically rendered here from Supabase -->
            </ul>
          </nav>
        </aside>
        <div class="sidebar-footer">
          <button id="save-order-btn" class="btn-primary mt-2 hidden" style="background-color: var(--accent-color); color: #000; border-color: var(--accent-color);">並び替えを保存</button>
          <button id="add-concept-btn" class="btn-primary hidden">＋ コンセプトを追加</button>
          <button id="admin-mode-btn" class="btn-secondary mt-2">管理者モード</button>
          <button id="exit-admin-btn" class="btn-secondary mt-2 hidden">管理者モード終了</button>
        </div>
      </div>

      <main class="main-content" id="main-content">
        <!-- Content will be injected here dynamically -->
      </main>
    </div>

    <script type="module" src="/main.js"></script>
  </body>
</html>
